<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | SUI-GENERIS</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #FFFFFF;
      padding: 2.5rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header img {
      height: 60px;
      margin-bottom: 1rem;
    }
    .login-header h2 {
      color: var(--primary-navy);
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <img src="assets/logos/sui generis logo 1.jpg" alt="SUI-GENERIS Logo">
      <h2>Admin Authentication</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Access internal lead management desk</p>
    </div>

    <form id="login-form" class="form-grid">
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>Admin Email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@suigeneristravel.com" required>
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In to Dashboard</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { App } from './js/app.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
        
        await Auth.login(email, password);
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        App.showToast(err.message || 'Invalid credentials. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
