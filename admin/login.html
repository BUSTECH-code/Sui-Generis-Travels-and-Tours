<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SUI-GENERIS TRAVELS AND TOURS</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="login-page">

<div class="login-wrapper">

    <div class="login-card">

        <img
        src="../assets/logos/sui generis logo 1.jpg"
        class="login-logo"
        alt="SUI GENERIS">

        <h2>Admin Portal</h2>

        <p>Sign in to continue.</p>

        <form id="login-form">

            <div class="form-group">

                <label>Email</label>

                <input
                type="email"
                id="email"
                required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                type="password"
                id="password"
                required>

            </div>

            <button type="submit">

                <i class="fa-solid fa-lock"></i>

                Sign In

            </button>

        </form>

        <p id="login-error"></p>

    </div>

</div>

<script type="module" src="../js/login.js"></script>

</body>
</html>
