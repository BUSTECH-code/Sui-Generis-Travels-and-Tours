  <!-- Hero Banner -->
  <section class="page-hero">
    <div class="container">
      <h1>Visa Application & Processing</h1>
      <p>Professional advisory for Tourist, Work, Student, and Corporate travel visas.</p>
    </div>
  </section>

  <!-- Form Section -->
  <section class="section-padding bg-surface">
    <div class="container container-narrow">
      <div class="card form-card">
        <h2 class="form-title">Visa Application Portal</h2>
        
        <form data-supabase-form="visa_applications">
          <div class="form-group">
            <label>Full Applicant Name</label>
            <input type="text" name="fullname" class="form-control" required placeholder="John Doe">
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" name="email" class="form-control" required placeholder="john@example.com">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" name="phone" class="form-control" required placeholder="08012345678">
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Target Country</label>
              <input type="text" name="destination_country" class="form-control" required placeholder="e.g. UK, Canada, USA, UAE">
            </div>
            <div class="form-group">
              <label>Visa Category</label>
              <select name="visa_category" class="form-control" required>
                <option value="Tourist Visa">Tourist / Visit Visa</option>
                <option value="Student Visa">Student Visa</option>
                <option value="Work Visa">Work Visa</option>
                <option value="Umrah/Hajj">Umrah / Hajj Package</option>
                <option value="Immigration">Immigration Services</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Passport Number</label>
              <input type="text" name="passport_number" class="form-control" required placeholder="A12345678">
            </div>
            <div class="form-group">
              <label>Intended Travel Date</label>
              <input type="text" id="visa-date" name="travel_date" class="form-control" required placeholder="YYYY-MM-DD">
            </div>
          </div>

          <div class="form-group">
            <label>Additional Information</label>
            <textarea name="notes" class="form-control" rows="3" placeholder="Previous visa refusals, travel history, or specific questions..."></textarea>
          </div>

          <button type="submit" class="btn-book-now btn-full mt-1">
            Submit Visa Assistance Request
          </button>
        </form>
      </div>
    </div>
  </section>
